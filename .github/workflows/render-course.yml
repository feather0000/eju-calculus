name: Render course sources

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'topics/**'
      - 'claude/**'
      - 'explorer/**'
      - 'assets/topics.txt'
      - 'assets/bank_analysis.json'
      - '.github/workflows/render-course.yml'
  workflow_dispatch:

concurrency:
  group: render-course-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Render and verify the published files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git checkout --detach FETCH_HEAD
            python3 tools/build_extras.py
            python3 tools/verify_tips.py
            python3 tools/apply_mwg_polish.py --check
            git add -- index.html 404.html topics claude/index.html explorer/index.html assets/nav.js assets/search.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Render updated EJU calculus lessons"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Publish the latest main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
